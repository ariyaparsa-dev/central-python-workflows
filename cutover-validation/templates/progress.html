<html lang="en">
<head>
<meta charset="UTF-8">
<title>Validation Progress</title>

<style>

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #111827;
    color: #e5e7eb;
    text-align: center;
    padding-top: 80px;
}

h1 {
    color: #00b388;
}

.progress-container {
    width: 80%;
    max-width: 800px;
    margin: auto;
}

.progress-bar {
    width: 100%;
    height: 30px;
    background: #374151;
    border-radius: 20px;
    overflow: hidden;
}


.progress-fill {
    width: 0%;
    height: 100%;
    background: #00b388;
    transition: width 0.5s ease;

    color: white;
    font-weight: bold;
    text-align: center;
    line-height: 30px;
}


.info {
    margin-top: 20px;
    font-size: 18px;
}

.device {
    margin-top: 10px;
    font-family: Consolas, monospace;
    color: #93c5fd;
}

button {

    padding: 12px 24px;

    border: none;
    border-radius: 8px;

    background: #00b388;

    color: white;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;
}

button:hover {
    background: #009970;
}

</style>
</head>
<body>

<h1>Running Validation</h1>

<div class="progress-container">

    <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
    </div>

    <div class="info">
        <span id="completed">0</span> /
        <span id="total">0</span>
        devices complete
    </div>
    <div class="info">
        Successful:
        <span id="successful">0</span>
    </div>

<div class="info">
    Failed:
    <span id="failed">0</span>
</div>

    <div class="device">
        Last Completed Device:
        <span id="currentDevice">Waiting...</span>
    </div>

    <div class="info">
        Status:
        <span id="status">Starting...</span>
    </div>

    <div style="margin-top:30px;">
      <button
        id="viewResultsBtn"
        style="display:none;"
        onclick="window.location.href='/validation_results'"
       >
       View Results
      </button>
	
	<div id="completionSummary"
     	   style="display:none;
         	margin-top:20px;
          	font-size:18px;
         	color:#00b388;">
	</div>

    </div>

</div>

<script>

function refreshProgress() {

    fetch("/progress")
    .then(r => r.json())
    .then(data => {

	document.getElementById(
	    "successful"
	).innerText = data.successful || 0;

	document.getElementById(
	    "failed"
	).innerText = data.failed || 0;

        document.getElementById("completed").innerText =
            data.completed;

        document.getElementById("total").innerText =
            data.total;

        document.getElementById("currentDevice").innerText =
            data.current_device;

        document.getElementById("status").innerText =
            data.status;

if (data.total > 0) {

    const percent =
        Math.round((data.completed / data.total) * 100);

    console.log(
        "Completed:",
        data.completed,
        "Total:",
        data.total,
        "Percent:",
        percent
    );

    document.getElementById("progressFill")
        .style.width = percent + "%";

    document.getElementById("progressFill")
        .innerText = percent + "%";
}


if (data.status === "completed") {

    document.querySelector("h1").innerText =
        "✅ Validation Complete";

    document.querySelector("#status")
        .parentElement.style.display = "none";

    document.getElementById(
        "viewResultsBtn"
    ).style.display = "inline-block";

    if (data.failed > 0) {

        document.getElementById("progressFill")
            .style.background = "#dc2626";
    }

    document.getElementById(
        "status"
    ).innerText = "Completed";

    document.getElementById(
        "completionSummary"
    ).innerText =
        `Validation complete: ${data.successful} successful, ${data.failed} failed`;

    document.getElementById(
        "completionSummary"
    ).style.display = "block";
}



    });

}

setInterval(refreshProgress, 1000);
refreshProgress();

</script>
</body>
</html>
